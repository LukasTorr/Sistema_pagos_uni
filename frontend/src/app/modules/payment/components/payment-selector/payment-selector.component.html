<div class="payment-page">

  <div class="payment-wrapper">

    <div class="nyu-card nyu-card-lg payment-card">

      <h2 class="title-nyu">
        Servicio de Pagos NYU
      </h2>

      <h5 class="subtitle-nyu">
        Medio de pago
      </h5>

      <div class="methods-container">

        <div class="payment-methods">

          <button
            class="payment-btn"
            [ngClass]="selectedMethod === 'card' ? 'active' : ''"
            (click)="selectMethod('card')">

            Tarjeta

          </button>

          <button
            class="payment-btn"
            [ngClass]="selectedMethod === 'transfer' ? 'active' : ''"
            (click)="selectMethod('transfer')">

            Transferencia

          </button>

          <button
            class="payment-btn"
            [ngClass]="selectedMethod === 'wallet' ? 'active' : ''"
            (click)="selectMethod('wallet')">

            Billetera

          </button>

        </div>

      </div>

      <div class="payment-box">

        <ng-container [ngSwitch]="selectedMethod">

          <app-card-form
            *ngSwitchCase="'card'"
            (formReady)="onCardFormReady($event)">
          </app-card-form>

          <app-transfer-form
            *ngSwitchCase="'transfer'"
            (formReady)="onTransferFormReady($event)">
          </app-transfer-form>

          <app-wallet-form
            *ngSwitchCase="'wallet'"
            (formReady)="onWalletFormReady($event)">
          </app-wallet-form>

        </ng-container>

      </div>

      <div class="pay-button-container">

        <button
          class="btn-pay"
          (click)="submit()"
          [disabled]="!canPay() || isProcessing">

          {{ isProcessing ? 'Procesando...' : 'Pagar' }}

        </button>

      </div>

    </div>

  </div>

</div>

<div
  class="payment-loading"
  *ngIf="isProcessing">

  <div class="loading-card">

    <div
      class="spinner-border text-primary"
      role="status">
    </div>

    <h5 class="mt-3">
      Procesando pago
    </h5>

    <p class="mb-0">
      Espere un momento...
    </p>

  </div>

</div>
