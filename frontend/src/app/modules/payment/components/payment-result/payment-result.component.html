<div class="payment-page d-flex justify-content-center align-items-center">

  <div class="payment-wrapper">

    <div class="nyu-card p-4 text-center">

      <h2 class="title-nyu">Resultado del pago</h2>

      <div *ngIf="result">

        <div *ngIf="result.status === 'PAID'; else error">

          <h4 class="text-success">Pago exitoso</h4>
          <p>Orden: {{ result.orderId }}</p>
          <p>Fecha: {{ result.processedAt }}</p>

        </div>

        <ng-template #error>
          <h4 class="text-danger">Pago rechazado</h4>
          <p>{{ result.rejectionReason }}</p>
        </ng-template>

      </div>

    </div>

  </div>

</div>
